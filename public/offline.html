<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل | Offline</title>
    <style>
      body {
        margin: 0;
        font-family: 'Playpen Sans Arabic', sans-serif;
        background: #FFFFFF;
        color: #191b25;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .logo {
        width: 120px;
        height: auto;
        margin-bottom: 20px;
        object-fit: contain;
      }
      h1 { font-size: 2.2rem; margin-bottom: 10px; color: #111020; }
      p { font-size: 1.1rem; color: #555; max-width: 440px; margin: 0 auto; line-height: 1.6; }
      button {
        margin-top: 24px;
        padding: 12px 32px;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        background: linear-gradient(to right, #50347F, #414B93, #2F61A0, #213766, #2368A3, #0F83B6);
        color: white;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.2s;
        box-shadow: 0 4px 12px rgba(80, 52, 127, 0.2);
      }
      button:hover { opacity: 0.95; transform: scale(1.02); }
    </style>
  </head>
  <body>
    <div>
      <img src="/images/logo.png" alt="Sci Infinity" class="logo" />
      <h1>غير متصل بالإنترنت</h1>
      <p>عذراً، لا يبدو أنك متصل بالإنترنت حالياً. يمكنك متابعة تصفح المحتوى المحفوظ أو إعادة المحاولة.</p>
      <button onclick="window.location.reload()">حاول مرة أخرى</button>
    </div>
  </body>
</html>
